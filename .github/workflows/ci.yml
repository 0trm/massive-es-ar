name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Cache MASSIVE es-ES
        uses: actions/cache@v4
        with:
          path: data/raw
          key: massive-1.1-es-ES

      - name: Get MASSIVE es-ES and check row counts
        run: uv run python -m massive_es_ar.data

      - name: Tests
        run: uv run pytest -q
